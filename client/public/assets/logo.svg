<svg width="180" height="42" viewBox="0 0 180 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Google-inspired Multi-colored Infinity Loop Emblem & Amazon Smile Arrow -->
  <g filter="url(#glow)">
    <!-- Infinity Ribbon -->
    <path d="M 8,21 C 8,14 13,9 18,9 C 23,9 24,14 24,21 C 24,28 25,33 30,33 C 35,33 40,28 40,21 C 40,14 35,9 30,9 C 25,9 24,14 24,21 C 24,28 23,33 18,33 C 13,33 8,28 8,21 Z" 
          stroke="url(#google_colors)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Pulse Spark Core -->
    <circle cx="24" cy="21" r="2" fill="#FFFFFF" />
  </g>

  <!-- Amazon-inspired Smile Arrow -->
  <g>
    <path d="M 24,35 Q 70,44 116,33" stroke="#FF9900" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 112,35 L 118,32 L 115,26 Z" fill="#FF9900" />
  </g>

  <!-- Typography Wordmark: Thodar -->
  <text x="48" y="27" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.6">
    <tspan fill="#FFFFFF">Tho</tspan><tspan fill="url(#text_grad)" font-weight="800">dar</tspan>
  </text>

  <!-- Subtitle Tagline Dot -->
  <circle cx="125" cy="25" r="2" fill="#FF9900" />

  <defs>
    <!-- Google Colors Rainbow Gradient -->
    <linearGradient id="google_colors" x1="8" y1="9" x2="40" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="35%" stop-color="#EA4335" />
      <stop offset="70%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>

    <!-- Text Flow Gradient: Deep Electric Blue to Cyan -->
    <linearGradient id="text_grad" x1="85" y1="12" x2="120" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Subtle Premium Glow -->
    <filter id="glow" x="3" y="4" width="45" height="34" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4285F4" flood-opacity="0.3" />
    </filter>
  </defs>
</svg>
